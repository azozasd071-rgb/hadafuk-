<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>هدفك — هيدر الموقع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@400;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css">
<style>
  html, body { width: 1600px; height: 460px; }
  .board { width: 1600px; height: 460px; }
  .frame { display: none; }
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 60px;
    padding: 0 96px 8px;
  }
  .text { display: flex; flex-direction: column; gap: 2px; }
  .eyebrow { font-size: 23px; }
  .name { margin-top: 6px; }
  .name .title { font-size: 40px; }
  .name .first { font-size: 118px; margin-top: 4px; }
  .brandline { justify-content: flex-start; gap: 18px; margin-top: 0; }
  .wordmark { font-size: 62px; }
  .brandline .bar { width: 62px; height: 6px; }
  .chips { margin-top: 20px; gap: 10px; }
  .chip { font-size: 20px; padding: 8px 18px; background: rgba(255, 255, 255, 0.75); }
  .logo-block { width: 360px; height: 360px; }
  .logo-wrap { width: 246px; height: 246px; }
  .card-diamond { width: 173px; height: 173px; }
  .logo-glow { width: 330px; height: 330px; }
  .ring.r1 { width: 208px; height: 208px; }
  .ring.r2 { width: 244px; height: 244px; }
  .logo-dot { display: none; }
</style>
</head>
<body>
<section class="board light">
  <div class="glow teal"></div>
  <div class="glow orange"></div>

  <div class="content">
    <div class="text">
      <div class="eyebrow"><span class="dia"></span> سلسلة هدفك للقدرات</div>
      <div class="name">
        <span class="title">دكتور</span>
        <span class="first">أيمن</span>
      </div>
      <div class="brandline">
        <span class="wordmark">هدفك</span>
        <span class="dot"></span>
      </div>
      <div class="chips">
        <span class="chip hot">اختبارات تليجرام</span>
        <span class="chip">بث واتساب</span>
        <span class="chip">إحصائيات الطلاب</span>
      </div>
    </div>

    <div class="logo-block">
      <div class="logo-glow"></div>
      <div class="ring r2"></div>
      <div class="ring r1"></div>
      <div class="logo-wrap">
        <div class="card-diamond"></div>
        <img class="logo" src="hadafuk-strokes.png" alt="شعار هدفك">
      </div>
      <span class="logo-dot"></span>
    </div>
  </div>

  <div class="accent-edge"></div>
</section>
</body>
</html>
