<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>هدفك — سوشال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@400;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css">
<style>
  html, body { width: 1080px; height: 1080px; }
  .board { width: 1080px; height: 1080px; }
  .frame { inset: 26px; }
  .stack {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 70px 80px 96px;
  }
  .logo-block { width: 420px; height: 420px; margin-bottom: 4px; }
  .logo-wrap { width: 268px; height: 268px; }
  .card-diamond { width: 188px; height: 188px; }
  .logo-glow { width: 380px; height: 380px; }
  .ring.r1 { width: 230px; height: 230px; }
  .ring.r2 { width: 272px; height: 272px; }
  .logo-dot { display: none; }
  .eyebrow { font-size: 24px; }
  .name { margin-top: 6px; }
  .name .title { font-size: 42px; }
  .name .first { font-size: 148px; margin-top: 8px; }
  .brandline { justify-content: center; gap: 22px; margin-top: 2px; }
  .wordmark { font-size: 82px; }
  .brandline .bar { width: 64px; height: 6px; }
  .chips { justify-content: center; margin-top: 34px; gap: 10px; }
  .chip { font-size: 21px; padding: 10px 20px; }
  .foot { left: 70px; right: 70px; bottom: 44px; font-size: 20px; }
  .foot .mid { display: none; }
</style>
</head>
<body>
<section class="board">
  <div class="glow teal"></div>
  <div class="glow orange"></div>
  <div class="frame"></div>

  <div class="stack">
    <div class="logo-block">
      <div class="logo-glow"></div>
      <div class="ring r2"></div>
      <div class="ring r1"></div>
      <div class="logo-wrap">
        <div class="card-diamond"></div>
        <img class="logo" src="hadafuk-strokes.png" alt="شعار هدفك">
      </div>
      <span class="logo-dot"></span>
    </div>
    <div class="eyebrow"><span class="dia"></span> سلسلة هدفك للقدرات</div>
    <div class="name">
      <span class="title">دكتور</span>
      <span class="first">أيمن</span>
    </div>
    <div class="brandline">
      <span class="wordmark">هدفك</span>
      <span class="dot"></span>
    </div>
    <div class="chips">
      <span class="chip hot">اختبارات تليجرام</span>
      <span class="chip">بث واتساب</span>
      <span class="chip">إحصائيات الطلاب</span>
    </div>
  </div>

  <footer class="foot">
    <span>سلسلة هدفك للقدرات</span>
    <span class="ltr">@hadafukbot</span>
  </footer>
</section>
</body>
</html>
